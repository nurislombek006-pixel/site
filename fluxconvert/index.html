<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c1220">
  <meta name="description" content="FluxConvert — простой конвертер файлов онлайн.">
  <title>FluxConvert — конвертер файлов</title>
  <style>
    :root{color-scheme:dark;--bg:#0c1220;--panel:#161f30;--line:#344158;--text:#f7f8fc;--muted:#a3b0c4;--accent:#9285ff;--green:#61dfb9;--red:#ff9b9b}
    *{box-sizing:border-box}
    body{margin:0;min-width:320px;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
    button,select,input{font:inherit}
    button{cursor:pointer}
    a{color:inherit;text-decoration:none}
    button:focus-visible,a:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
    header{width:100%;max-width:1060px;padding:25px 24px;margin:0 auto}
    .brand{display:inline-flex;align-items:center;gap:10px;font-size:19px;font-weight:800;letter-spacing:-.5px}
    .brandmark{display:grid;place-items:center;width:35px;height:35px;border-radius:10px;background:#7467e9;color:white;font-size:23px;font-weight:650;line-height:1}
    .brand b{color:#b1aaff}
    main{flex:1;display:flex;justify-content:center;align-items:center;padding:35px 20px 80px}
    .workspace{width:min(100%,570px)}
    h1{text-align:center;font-size:clamp(30px,5vw,41px);font-weight:800;letter-spacing:-1.4px;margin:0 0 8px;line-height:1.2}
    .subtitle{text-align:center;color:var(--muted);font-size:14px;margin:0 0 32px}
    .converter{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 20px 55px #02071146}
    .dropzone{display:flex;align-items:center;justify-content:center;min-height:178px;border:1.5px dashed #67738f;border-radius:14px;padding:22px;text-align:center;cursor:pointer;transition:border-color .2s,background .2s}
    .dropzone:hover,.dropzone.dragover{border-color:#a99fff;background:#9589ff11}
    .dropzone:focus-visible{outline-offset:4px}
    .fileinput{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
    .upload-icon{display:grid;place-items:center;width:49px;height:49px;margin:0 auto 14px;border-radius:13px;background:#8f84ff1c;color:#b9b2ff}
    .upload-icon svg{width:25px;height:25px}
    .upload-title{display:block;max-width:430px;margin:auto;font-size:16px;font-weight:750;overflow-wrap:anywhere}
    .drop-desc{display:block;color:var(--muted);font-size:12px;margin-top:5px}
    .limit{text-align:center;color:#8492a9;font-size:12px;margin:12px 0 24px}
    .field label{display:block;margin-bottom:8px;font-size:13px;font-weight:680}
    .selectwrap{position:relative}
    select{appearance:none;width:100%;min-height:50px;background:#0e1727;border:1px solid #43506a;border-radius:11px;padding:12px 45px 12px 15px;color:var(--text);font-weight:650}
    select:disabled{color:#9aa5ba;opacity:.75}
    select option{background:#141e2d}
    .selectwrap:after{position:absolute;right:17px;top:9px;color:#b1bbcd;content:"⌄";font-size:21px;pointer-events:none}
    .convertbtn{display:block;width:100%;min-height:52px;margin-top:18px;border:0;border-radius:11px;background:#8c7bff;color:white;font-size:15px;font-weight:800;transition:background .2s,transform .2s}
    .convertbtn:hover:not(:disabled){background:#a094ff;transform:translateY(-1px)}
    .convertbtn:disabled{opacity:.45;cursor:not-allowed}
    .status{display:none;margin-top:15px;padding:15px;background:#0e1727;border:1px solid var(--line);border-radius:11px}
    .status.visible{display:block}
    .status.success{border-color:#3f937d}
    .status.error{border-color:#98535a}
    .statusrow{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px}
    .statusrow b{font-weight:720}
    .status small{display:block;margin-top:6px;color:var(--muted);font-size:12px;overflow-wrap:anywhere}
    .progress{height:5px;overflow:hidden;background:#313d54;border-radius:99px;margin-top:13px}
    .progress[hidden]{display:none}
    .progress span{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
    .progress.indeterminate span{width:42%;animation:slide 1.15s ease-in-out infinite alternate}
    @keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(230%)}}
    .downloadbtn{display:none;align-items:center;justify-content:center;padding:8px 13px;border:1px solid #61d4b0;border-radius:9px;background:#225a4d;color:#a1ffe1;font-weight:740;font-size:12px;white-space:nowrap}
    .downloadbtn.visible{display:inline-flex}
    .smallprint{margin:16px 3px 0;text-align:center;color:#8592a8;font-size:11px}
    @media(max-width:600px){
      header{padding:17px 20px}.brand{font-size:18px}
      main{align-items:flex-start;padding:65px 16px 45px}
      .subtitle{font-size:13px;margin-bottom:25px}
      .converter{padding:15px;border-radius:17px}
      .dropzone{min-height:165px;padding:18px}
      .statusrow{align-items:flex-start;flex-wrap:wrap}
    }
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <header><a class="brand" href="/" aria-label="FluxConvert"><span class="brandmark" aria-hidden="true">⇄</span><span>Flux<b>Convert</b></span></a></header>
  <main>
    <div class="workspace">
      <h1>Конвертер файлов</h1>
      <p class="subtitle">Загрузите файл, выберите формат и скачайте результат.</p>
      <section class="converter" aria-label="Конвертация файлов">
        <div class="dropzone" id="dropzone" role="button" tabindex="0" aria-label="Выбрать файл или перетащить его сюда">
          <input class="fileinput" id="file" type="file" aria-label="Выбрать файл">
          <div aria-live="polite">
            <span class="upload-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0-4 4m4-4 4 4M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg></span>
            <strong class="upload-title" id="uploadTitle">Выбрать файл</strong>
            <span class="drop-desc" id="uploadDesc">или перетащите сюда</span>
          </div>
        </div>
        <p class="limit" id="limitHint">До 80 МБ</p>
        <div class="field">
          <label for="target">Преобразовать в</label>
          <div class="selectwrap"><select id="target" disabled><option value="">Сначала выберите файл</option></select></div>
        </div>
        <button class="convertbtn" id="convert" type="button" disabled>Конвертировать</button>
        <div class="status" id="status" aria-live="polite">
          <div class="statusrow"><b id="statusTitle">Обработка</b><a id="download" class="downloadbtn" download>↓ Скачать</a></div>
          <small id="statusDesc"></small>
          <div class="progress" id="progress"><span id="progressFill"></span></div>
        </div>
      </section>
      <p class="smallprint">Файлы обрабатываются временно. Для PDF → изображения результат скачивается как ZIP.</p>
    </div>
  </main>
  <script>
    'use strict';
    const FALLBACK_MATRIX = {"jpg":["png","webp","bmp","gif","tiff","pdf"],"jpeg":["png","webp","bmp","gif","tiff","pdf"],"png":["jpg","webp","bmp","gif","tiff","pdf"],"webp":["png","jpg","bmp","gif","tiff","pdf"],"bmp":["png","jpg","webp","gif","tiff","pdf"],"gif":["png","jpg","webp","bmp","tiff","pdf"],"tif":["png","jpg","webp","bmp","gif","tiff","pdf"],"tiff":["png","jpg","webp","bmp","gif","pdf"],"ico":["png","jpg","webp","bmp","gif","tiff","pdf"],"doc":["docx","odt","rtf","pdf","txt"],"docx":["doc","odt","rtf","pdf","txt"],"odt":["docx","doc","rtf","pdf","txt"],"rtf":["docx","odt","pdf","txt"],"txt":["docx","odt","rtf","pdf"],"xls":["xlsx","ods","csv","pdf"],"xlsx":["xls","ods","csv","pdf"],"ods":["xlsx","xls","csv","pdf"],"csv":["xlsx","ods","pdf"],"ppt":["pptx","odp","pdf"],"pptx":["ppt","odp","pdf"],"odp":["pptx","ppt","pdf"],"mp3":["wav","ogg","flac","m4a","aac"],"wav":["mp3","ogg","flac","m4a","aac"],"ogg":["mp3","wav","flac","m4a","aac"],"flac":["mp3","wav","ogg","m4a","aac"],"m4a":["mp3","wav","ogg","flac","aac"],"aac":["mp3","wav","ogg","flac","m4a"],"wma":["mp3","wav","ogg","flac","m4a","aac"],"mp4":["webm","mkv","mp3","wav","m4a"],"mov":["mp4","webm","mkv","mp3","wav","m4a"],"mkv":["mp4","webm","mp3","wav","m4a"],"webm":["mp4","mkv","mp3","wav","m4a"],"avi":["mp4","webm","mkv","mp3","wav","m4a"],"pdf":["docx","txt","png","jpg"]};
    const $ = id => document.getElementById(id);
    const dropzone=$('dropzone'), fileInput=$('file'), targetSelect=$('target'), convertBtn=$('convert');
    let matrix=FALLBACK_MATRIX, chosenFile=null, busy=false, downloadUrl=null, maxMb=80;
    const isLocalImage = (src, target) => ['jpg','jpeg','png','webp'].includes(src) && ['jpg','png','webp'].includes(target);
    const ext = filename => (filename.split('.').pop() || '').toLowerCase();
    const size = bytes => bytes < 1024 ? bytes+' B' : bytes < 1048576 ? (bytes/1024).toFixed(1)+' KB' : (bytes/1048576).toFixed(2)+' MB';
    const pretty = format => format==='jpg' ? 'JPG / JPEG' : format.toUpperCase();
    async function syncFormats(){
      try{
        const response=await fetch('/api/formats',{signal:AbortSignal.timeout(2500)});
        if(response.ok){const data=await response.json();if(data.matrix&&typeof data.matrix==='object'){matrix=data.matrix;maxMb=data.max_upload_mb||80;}}
      }catch(e){}
      $('limitHint').textContent='До '+maxMb+' МБ';
      fileInput.accept=Object.keys(matrix).map(k=>'.'+k).join(',');
    }
    function clearStatus(){
      $('status').className='status';$('download').classList.remove('visible');$('progress').hidden=false;$('progress').className='progress';$('progressFill').style.width='0%';
      if(downloadUrl){URL.revokeObjectURL(downloadUrl);downloadUrl=null;}
    }
    function status(title,desc,mode){
      $('status').className='status visible'+(mode==='error'?' error':mode==='success'?' success':'');
      $('statusTitle').textContent=title;$('statusDesc').textContent=desc;
      $('progress').hidden=(mode==='error'||mode==='success');
    }
    function setFile(file){
      if(busy||!file)return;
      clearStatus();
      const extension=ext(file.name);
      let problem=null;
      if(!Object.hasOwn(matrix,extension))problem=['Формат не поддерживается','Выберите другой файл.'];
      else if(file.size>maxMb*1024*1024)problem=['Файл слишком большой','Максимум '+maxMb+' МБ.'];
      else if(!file.size)problem=['Пустой файл','Выберите непустой файл.'];
      if(problem){
        chosenFile=null;targetSelect.disabled=true;targetSelect.innerHTML='<option value="">Сначала выберите файл</option>';convertBtn.disabled=true;
        $('uploadTitle').textContent='Выбрать файл';$('uploadDesc').textContent='или перетащите сюда';
        status(problem[0],problem[1],'error');return;
      }
      chosenFile=file;
      $('uploadTitle').textContent=file.name;
      $('uploadDesc').textContent=size(file.size)+' · Нажмите, чтобы заменить';
      targetSelect.disabled=false;targetSelect.innerHTML='';
      for(const type of matrix[extension]){
        const label=extension==='pdf'&&['png','jpg'].includes(type)?pretty(type)+' (ZIP)':pretty(type);
        targetSelect.add(new Option(label,type));
      }
      const favorite=['pdf','docx','png','jpg','mp4','mp3'].find(type=>matrix[extension].includes(type));
      if(favorite)targetSelect.value=favorite;
      convertBtn.disabled=false;
    }
    function openPicker(){if(!busy){fileInput.value='';fileInput.click();}}
    dropzone.addEventListener('click',e=>{if(e.target!==fileInput)openPicker();});
    dropzone.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openPicker();}});
    fileInput.addEventListener('change',()=>setFile(fileInput.files[0]));
    ['dragenter','dragover'].forEach(type=>dropzone.addEventListener(type,e=>{e.preventDefault();e.stopPropagation();if(!busy)dropzone.classList.add('dragover');}));
    ['dragleave','drop'].forEach(type=>dropzone.addEventListener(type,e=>{e.preventDefault();e.stopPropagation();dropzone.classList.remove('dragover');}));
    dropzone.addEventListener('drop',e=>setFile(e.dataTransfer.files[0]));
    targetSelect.addEventListener('change',clearStatus);
    function imageConvertInBrowser(file,target){
      return new Promise((resolve,reject)=>{
        const img=new Image();const url=URL.createObjectURL(file);
        img.onload=()=>{
          try{const canvas=document.createElement('canvas');canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;
            const ctx=canvas.getContext('2d');if(target==='jpg'){ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);}
            ctx.drawImage(img,0,0);canvas.toBlob(blob=>{URL.revokeObjectURL(url);if(blob&&blob.type===(target==='jpg'?'image/jpeg':target==='png'?'image/png':'image/webp'))resolve(blob);else reject(new Error('Браузер не поддерживает сохранение в выбранном формате.'));},target==='jpg'?'image/jpeg':target==='png'?'image/png':'image/webp',.92);
          }catch(error){URL.revokeObjectURL(url);reject(error);}
        };
        img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Не удалось прочитать изображение.'));};img.src=url;
      });
    }
    async function ensureBackendReady(){
      if(location.hostname.endsWith('.github.io')){
        throw new Error('Вы открыли статическую версию GitHub Pages. Для конвертации Word, PDF и PPTX откройте сайт на адресе Render (onrender.com). На GitHub Pages работает только конвертация изображений.');
      }
      status('Подключаемся к серверу','Проверяем готовность сервера. На бесплатном Render первый запуск может занять до минуты…');
      try {
        const response=await fetch('/api/health',{cache:'no-store',signal:AbortSignal.timeout(70000)});
        if(!response.ok)throw new Error('HTTP '+response.status);
        const payload=await response.json();
        if(payload.ok!==true)throw new Error('Неверный ответ сервера');
      }catch(error){
        throw new Error('Не удалось связаться с сервером конвертации. Проверьте адрес сайта (нужен Render, а не GitHub Pages), статус сервиса и попробуйте позже. '+(error.name==='TimeoutError'?'Сервер слишком долго запускался.':''));
      }
      status('Загрузка файла','Сервер готов. Начинаем передачу…');
    }
    function serverConvert(file,target){
      return new Promise((resolve,reject)=>{
        const req=new XMLHttpRequest();req.open('POST','/api/convert');req.responseType='blob';req.timeout=180000;
        let lastProgress=Date.now(),uploaded=false,lastPercentage=0;
        const finish=()=>clearInterval(uploadWatchdog);
        const uploadWatchdog=setInterval(()=>{
          if(!uploaded && Date.now()-lastProgress>60000)req.abort();
        },5000);
        req.upload.onprogress=event=>{lastProgress=Date.now();if(event.lengthComputable){const p=Math.min(99,Math.round(event.loaded/event.total*100));lastPercentage=p;$('statusDesc').textContent='Загрузка на сервер: '+p+'%';$('progressFill').style.width=p+'%';}};
        req.upload.onload=()=>{uploaded=true;status('Идёт конвертация','Файл загружен, сервер обрабатывает его. Для большой презентации может потребоваться несколько минут.');$('progress').classList.add('indeterminate');};
        req.onload=async()=>{
          finish();
          if(req.status>=200&&req.status<300){resolve(req.response);}else{
            let msg='Сервер не смог конвертировать файл (HTTP '+req.status+').';
            try{const responseText=await req.response.text();const data=JSON.parse(responseText);msg=data.detail||msg;}catch(e){}
            if(req.status===502||req.status===503||req.status===504)msg+=' Возможно, сервер перезапустился или ему не хватило памяти для этого файла.';
            reject(new Error(msg));
          }
        };
        req.onerror=()=>{finish();reject(new Error('Соединение с сервером оборвалось. Если файл большой, проверьте память и журналы Render.'));};
        req.onabort=()=>{finish();reject(new Error('Загрузка остановилась на '+lastPercentage+'% более чем на минуту. Проверьте интернет и состояние сервера Render.'));};
        req.ontimeout=()=>{finish();reject(new Error('Время загрузки или конвертации истекло (3 минуты). Для больших PPTX может потребоваться более мощный сервер.'));};
        const form=new FormData();form.append('file',file,file.name);form.append('target',target);req.send(form);
      });
    }
    convertBtn.addEventListener('click',async()=>{
      if(!chosenFile||busy)return;
      const file=chosenFile,from=ext(file.name),to=targetSelect.value;
      if(!to)return;
      busy=true;convertBtn.disabled=true;fileInput.disabled=true;targetSelect.disabled=true;clearStatus();
      const local=isLocalImage(from,to);
      status('Подготавливаем файл',local?'Изображение обрабатывается прямо в вашем браузере.':'Начинаем безопасную загрузку…');
      if(local){$('progress').classList.add('indeterminate');}
      try{
        if(!local)await ensureBackendReady();
        const blob=local?await imageConvertInBrowser(file,to):await serverConvert(file,to);
        downloadUrl=URL.createObjectURL(blob);
        const targetExt=from==='pdf'&&['png','jpg'].includes(to)?'zip':to;
        $('download').href=downloadUrl;$('download').download=file.name.replace(/\.[^.]+$/,'')+'.'+targetExt;
        $('download').classList.add('visible');
        status('Файл готов!','Успешно: '+size(blob.size)+(local?' · без загрузки на сервер':' · готов к скачиванию'),'success');
      }catch(error){status('Не удалось конвертировать',error.message||'Попробуйте другой файл.','error');}
      finally{busy=false;convertBtn.disabled=false;fileInput.disabled=false;targetSelect.disabled=false;$('progress').classList.remove('indeterminate');}
    });
    syncFormats();
  </script>
</body>
</html>
